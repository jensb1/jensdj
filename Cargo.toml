[package]
name = "djengine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[workspace]
members = [
    "crates/djengine-core",
    "crates/djengine-analysis",
    "crates/djengine-audio",
    "crates/djengine-rpc",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.100"
arc-swap = "1.9.1"
aubio-rs = { version = "0.2.0", features = ["bindgen", "builtin"] }
basedrop = "0.1.3"
bytemuck = { version = "1.24.0", features = ["derive"] }
cpal = "0.17.3"
memmap2 = "0.9.10"
rayon = "1.11.0"
rtrb = "0.3.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
signalsmith-stretch = "0.1.3"
symphonia = { version = "0.6.0", features = ["all"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dependencies]
djengine-analysis = { path = "crates/djengine-analysis" }
djengine-audio = { path = "crates/djengine-audio" }
djengine-core = { path = "crates/djengine-core" }

[dev-dependencies]
signalsmith-stretch.workspace = true
